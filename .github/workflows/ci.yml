---
name: Offline Ansible validation

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache dependency downloads and pinned collection
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/uv
            .ansible/collections/ansible_collections/ansible/posix
          key: deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements-dev.txt', 'collections.yml', 'collections.lock.json') }}
      - name: Prepare project-local toolchain and validation dependencies
        run: make deps-ci
      - name: Run offline validation without production credentials
        run: make ci
