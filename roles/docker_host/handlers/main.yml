---
- name: Restart Docker after validated configuration changes
  ansible.builtin.systemd_service:
    name: docker.service
    state: restarted
  become: true

- name: Confirm Docker logging after activation
  ansible.builtin.command:
    argv: [docker, info, --format, "{{ '{{.LoggingDriver}}' }}"]
  become: true
  changed_when: false
  register: docker_host_active_logging
  failed_when: docker_host_active_logging.rc != 0 or docker_host_active_logging.stdout != 'local'
  listen: Restart Docker after validated configuration changes

- name: Complete Docker activation receipt
  ansible.builtin.file:
    path: /etc/docker/portfolio-activation.pending
    state: absent
  become: true
  listen: Restart Docker after validated configuration changes
