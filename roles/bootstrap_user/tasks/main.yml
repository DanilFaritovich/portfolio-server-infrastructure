---
- name: Validate and load the public key on the controller
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ansible_become: false
  tags:
    - bootstrap_user_controller_key
  block:
    - name: Validate bootstrap inputs before contacting the host
      ansible.builtin.assert:
        that:
          - bootstrap_user_name is string
          - bootstrap_user_name is match('^[a-z_][a-z0-9_-]{0,30}$')
          - bootstrap_user_name != 'root'
          - bootstrap_user_name != (hostvars[inventory_hostname].ansible_user | default(''))
          - bootstrap_user_home is string
          - bootstrap_user_home == '/home/' ~ bootstrap_user_name
          - bootstrap_user_shell == '/bin/bash'
          - bootstrap_user_public_key_path is string
          - bootstrap_user_public_key_path is match('^/.+\.pub$')
          - bootstrap_user_allow_passwordless_sudo is boolean
          - bootstrap_user_allow_passwordless_sudo
        fail_msg: >-
          Use a separate non-root managed username, a /home/<user> home,
          an absolute local .pub path and explicit boolean consent for
          root-equivalent NOPASSWD sudo.
        quiet: true

    - name: Load the validated controller public key
      ansible.builtin.import_tasks: controller_key.yml

- name: Inspect required sudo paths before changing the account
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
  loop:
    - /usr/sbin/visudo
    - /etc/sudoers.d
  register: bootstrap_user_sudo_paths
  become: true

- name: Require sudo and its include directory to already exist
  ansible.builtin.assert:
    that:
      - bootstrap_user_sudo_paths.results[0].stat.isreg | default(false)
      - bootstrap_user_sudo_paths.results[0].stat.executable | default(false)
      - bootstrap_user_sudo_paths.results[1].stat.isdir | default(false)
    fail_msg: Install/configure sudo and enable /etc/sudoers.d before bootstrap.
    quiet: true

- name: Configure the managed automation account
  ansible.builtin.import_tasks: account.yml
