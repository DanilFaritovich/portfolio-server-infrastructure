---
- name: Restart managed journald
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted
  become: true

- name: Confirm journald is active after activation
  ansible.builtin.command:
    argv: [systemctl, is-active, systemd-journald.service]
  become: true
  changed_when: false
  register: server_operations_journal_active
  failed_when: server_operations_journal_active.rc != 0 or server_operations_journal_active.stdout != 'active'
  listen: Restart managed journald

- name: Complete journald activation receipt
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d/portfolio-activation.pending
    state: absent
  become: true
  listen: Restart managed journald
