---
- name: Harden the Docker-ready host firewall and SSH ports
  hosts: bootstrap
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Require managed non-interactive OpenSSH access
      ansible.builtin.assert:
        that:
          - ansible_user == 'ansible'
          - ansible_connection == 'ssh'
          - ansible_private_key_file is defined
          - ansible_host_key_checking | bool
        fail_msg: Use make harden after managed access and Docker verification.
        quiet: true
  roles:
    - role: host_hardening
