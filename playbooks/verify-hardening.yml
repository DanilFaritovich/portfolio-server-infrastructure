---
- name: Verify hardening without changing managed state
  hosts: bootstrap
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require managed non-interactive OpenSSH access
      ansible.builtin.assert:
        that:
          - ansible_user == 'ansible'
          - ansible_connection == 'ssh'
          - ansible_private_key_file is defined
          - ansible_host_key_checking | bool
        fail_msg: Use make verify-hardening with the dedicated automation key.
        quiet: true

    - name: Verify SSH configuration listeners firewall and runtime services
      portfolio_hardening_info:
        ssh_ports: "{{ ssh_listen_ports | default([ansible_port | int]) }}"
        tcp_ports: "{{ firewall_allowed_tcp_ports | default([80, 443]) }}"
        verify: true
      become: true
