---
- name: Configure bounded server operations policy
  hosts: bootstrap
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Require confirmed managed non-interactive OpenSSH access
      ansible.builtin.assert:
        that:
          - server_operations_confirmed | default(false) | bool
          - ansible_user == 'ansible'
          - ansible_connection == 'ssh'
          - ansible_private_key_file is defined
          - ansible_host_key_checking | bool
          - ansible_become_flags == '-n'
        fail_msg: Use make setup-operations after confirming the managed access handoff.
        quiet: true
  roles:
    - role: server_operations
