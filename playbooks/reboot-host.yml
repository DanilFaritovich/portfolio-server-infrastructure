---
- name: Reboot the verified host and wait for bounded recovery
  hosts: bootstrap
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require confirmed managed non-interactive OpenSSH access
      ansible.builtin.assert:
        that:
          - reboot_host_confirmed | default(false) | bool
          - ansible_user is match('^[a-z_][a-z0-9_-]{0,30}$')
          - ansible_user != 'root'
          - ansible_connection == 'ssh'
          - ansible_private_key_file is defined
          - ansible_host_key_checking | bool
          - ansible_become_flags == '-n'
        fail_msg: Use make reboot-host with its access preflight and interactive confirmation.
        quiet: true

    - name: Reboot and wait for a new boot ID and readiness
      ansible.builtin.reboot:
        reboot_timeout: 300
        connect_timeout: 10
        post_reboot_delay: 5
      become: true
