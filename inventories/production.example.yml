---
all:
  children:
    bootstrap:
      hosts:
        portfolio:
          ansible_host: vps.example.invalid
          # Set the existing SSH port; bootstrap does not change it.
          ansible_port: 22
          # Initial password login is used only by bootstrap.
          bootstrap_login_user: root
          # All subsequent stages use this non-root account and local key.
          ansible_user: ansible
          ansible_private_key_file: ~/.ssh/portfolio-server-infrastructure/ansible_ed25519
          ansible_python_interpreter: /usr/bin/python3
          # Keep the current port during the first transition.
          ssh_listen_ports: [22]
          # External SSH probes; omitted defaults to all ssh_listen_ports.
          ssh_verify_ports: [22]
          firewall_allowed_tcp_ports: [80, 443]
